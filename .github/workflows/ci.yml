name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Code tests
        run: python -m pytest
      - name: Run the pipeline on day 1
        run: python run_pipeline.py data/raw/orders_day1.csv