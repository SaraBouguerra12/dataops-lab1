version: 2

models:
  - name: orders_clean
    description: Orders that passed every quality rule
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ["France", "Germany", "Italy", "Morocco", "Tunisia"]

  - name: revenue_by_country
    description: Revenue per country, read by the sales director
    columns:
      - name: country
        data_tests:
          - unique
